version: '3.7'
services:
  mysql:
    # mysql:8.0, mysql:8.4, mysql:9 and mariadb work too; on MySQL 8 and later the
    # tests that create stored functions need log_bin_trust_function_creators=1:
    #   docker compose exec mysql mysql -uroot -e "SET PERSIST log_bin_trust_function_creators = 1"
    image: mysql:5.7
    restart: always
    ports: ['3306:3306']
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=mysqln_testdb
      - MYSQL_USER=mysqln_test
      - MYSQL_PASSWORD=pass123
