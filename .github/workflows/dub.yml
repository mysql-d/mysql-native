name: Builds

# Overall MySQL Native should work on the last 10 minor compiler releases (same as Vibe.d).
# For simplicity and speed of the CI, the latest versions of dmd and ldc must are tested on
# all platforms (Windows, Linux, and Mac) with older compilers only being tested on Windows/Linux.
# The integration testing (via examples) is done on Linux against Mysql 5.7

on:
  schedule:
    - cron: '30 7 1 * *'
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.compiler }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        compiler:
          - dmd-latest
          - ldc-latest
          - dmd-2.105.3 # (released in 2023) 
          - dmd-2.104.2 # (released in 2023)
          - dmd-2.103.1 # (released in 2023)
          - dmd-2.102.2 # (released in 2023)
          - dmd-2.101.2
          - dmd-2.098.1

          - ldc-1.35.0 # eq to dmd v2.105.2
          - ldc-1.34.0 # eq to dmd v2.104.2
          - ldc-1.33.0 # eq to dmd v2.103.1
          - ldc-1.31.0 # eq to dmd v2.101.2
          - ldc-1.28.1 # eq to dmd v2.098.1
    steps:
      - uses: actions/checkout@v4

      - name: Install D ${{ matrix.compiler }}
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ${{ matrix.compiler }}

      - name: Upgrade dub dependencies
        uses: WebFreak001/dub-upgrade@v0.1.1

      - name: Build Library
        run: dub build --build=release --config=library

      # cache
      - uses: WebFreak001/dub-upgrade@v0.1.1
        if: startsWith(matrix.os, 'windows')
        with: { store: true }

  # Older compiler versions
  build-older:
    name: ${{ matrix.compiler }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ] # don't bother with macos-latest
        compiler:
          - dmd-2.097.2
          - dmd-2.095.1
          - dmd-2.094.2
          - dmd-2.093.1
          - dmd-2.092.1
          - dmd-2.091.1
          - dmd-2.090.1
          - dmd-2.089.1
          - dmd-2.088.1
          - dmd-2.087.1
          - dmd-2.086.1
          - dmd-2.085.1
          # These compilers do not work with dub for downloading taggedalgebraic
          #- dmd-2.084.1
          #- dmd-2.083.1
          #- dmd-2.082.1
          #- dmd-2.081.2
          #- dmd-2.080.1
          - ldc-1.27.1 # eq to dmd v2.097.2
          - ldc-1.26.0 # eq to dmd v2.096.1
          - ldc-1.25.1 # eq to dmd v2.095.1
          - ldc-1.24.0 # eq to dmd v2.094.1
          - ldc-1.23.0 # eq to dmd v2.093.1
          - ldc-1.22.0 # eq to dmd v2.092.1
          - ldc-1.19.0 # eq to dmd v2.089.1
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install D ${{ matrix.compiler }}
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ${{ matrix.compiler }}

      - name: Upgrade dub dependencies
        uses: WebFreak001/dub-upgrade@v0.1.1

      - name: Build Library
        run: dub build --build=release --config=library

      # cache
      - uses: WebFreak001/dub-upgrade@v0.1.1
        with: { store: true }

  ## On Ubuntu we can use GDC. The compatibility of gdc is:
  ##   gcc gdc-10  -> D 2.076 (the default on Ubuntu 20.04 (ubuntu-latest), also available on 22.04)
  ##   gcc gdc-11  -> D 2.076 (requires Ubuntu 22.04)
  ##   gcc gdc-12  -> D 2.100 (requires Ubuntu 22.04)
  ##   gcc gdc-13  -> D 2.103 (requires Ubuntu 23.04 - no runners yet)
  gdc:
    name: ${{ matrix.compiler }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04 ]
        compiler: [ gdc-10, gdc-11, gdc-12 ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install DMD (so dub is available)
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-latest

      - name: Install ${{ matrix.compiler }}
        run: |
          sudo apt update
          sudo apt install ${{ matrix.compiler }} -y

      - name: Show version
        run: |
          ${{ matrix.compiler }} --version
          dub --version

      - name: Build Library (Release)
        env:
          DC: ${{ matrix.compiler }}
        run: dub build --compiler=${{ matrix.compiler }} --build=release
