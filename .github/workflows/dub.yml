name: Builds

# MySQL Native needs D frontend 2.094 or later (toolchainRequirements in dub.sdl).
# For simplicity and speed of the CI, the latest versions of dmd and ldc must are tested on
# all platforms (Windows, Linux, and Mac) with older compilers only being tested on Windows/Linux.
# The integration testing (via examples) is done on Linux against Mysql 5.7

on:
  schedule:
    - cron: '30 7 1 * *'
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.compiler }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        compiler:
          - dmd-latest
          - ldc-latest
          - dmd-2.101.2
          - dmd-2.098.1
        # macos-latest is arm64: setup-dlang installs no DMD there, and it asks
        # for LDC 1.28.1 under a file name that doesn't exist (osx-aarch64
        # instead of osx-arm64). Those run on Intel macOS instead. On current
        # macOS (Intel too) the dmd 2.101.2 binary fails to run, so it is
        # tested on Linux and Windows only. LDC 1.31.0 (its dub crashes on
        # macOS) and LDC 1.28.1 on Linux/Windows are in build-older.
        exclude:
          - { os: macos-latest, compiler: dmd-latest }
          - { os: macos-latest, compiler: dmd-2.101.2 }
          - { os: macos-latest, compiler: dmd-2.098.1 }
        include:
          - { os: macos-15-intel, compiler: dmd-latest }
          - { os: macos-15-intel, compiler: dmd-2.098.1 }
          - { os: macos-15-intel, compiler: ldc-1.28.1 }
    steps:
      - uses: actions/checkout@v7

      - name: Install D ${{ matrix.compiler }}
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Upgrade dub dependencies
        uses: WebFreak001/dub-upgrade@v0.2.0

      - name: Build Library
        run: dub build --build=release --config=library

  # Older compiler versions
  build-older:
    name: ${{ matrix.compiler }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Prebuilt older LDC binaries need libxml2.so.2, which Ubuntu 26.04
        # (ubuntu-latest) no longer provides, so pin Ubuntu 24.04.
        os: [ ubuntu-24.04, windows-latest ] # don't bother with macos-latest
        compiler:
          - dmd-2.097.2
          - dmd-2.095.1
          # 2.094 is the oldest supported frontend: the RSA code of
          # caching_sha2_password (#288) needs std.bigint's powmod and
          # BigInt(bool, Range), new in 2.094
          - dmd-2.094.2
          - ldc-1.31.0 # eq to dmd v2.101.2
          - ldc-1.28.1 # eq to dmd v2.098.1
          - ldc-1.27.1 # eq to dmd v2.097.2
          - ldc-1.26.0 # eq to dmd v2.096.1
          - ldc-1.25.1 # eq to dmd v2.095.1
          - ldc-1.24.0 # eq to dmd v2.094.1
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install D ${{ matrix.compiler }}
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Upgrade dub dependencies
        uses: WebFreak001/dub-upgrade@v0.2.0

      - name: Build Library
        run: dub build --build=release --config=library
